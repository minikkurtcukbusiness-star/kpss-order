name: KPSS OCR Import

on:
  push:
    branches: [main]
    paths:
      - 'soruk/*.pdf'
      - 'kpss-backend-main/scripts/ocr-import-ci.js'
      - '.github/workflows/kpss-ocr.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  ocr:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install OCR tools
        run: |
          sudo apt-get update
          sudo apt-get install -y tesseract-ocr tesseract-ocr-tur poppler-utils

      - name: Install Node dependencies
        working-directory: kpss-backend-main
        run: npm ci

      - name: Run OCR import
        working-directory: kpss-backend-main
        run: node scripts/ocr-import-ci.js

      - name: Commit generated question pools
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add kpss-backend-main/data/parsed-questions/*-ocr.json
          if git diff --cached --quiet; then
            echo 'OCR çıktısında değişiklik yok.'
          else
            git commit -m 'chore: regenerate KPSS OCR question pools'
            git push
          fi
